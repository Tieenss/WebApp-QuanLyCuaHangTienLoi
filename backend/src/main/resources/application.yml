server:
  port: 8080

spring:
  application:
    name: cuahangtienloi
  security:
    # Disable default security user, custom UserDetailsService is registered
  config:
    import: optional:file:.env[.properties], optional:file:backend/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuahangtienloi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXBsZWFzZS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbg==}
  expiration: ${JWT_EXPIRATION:86400000} # 24h (milliseconds)

logging:
  level:
    root: INFO
    com.erp.cuahangtienloi: DEBUG
    org.hibernate.SQL: DEBUG
