server:
  port: 8080

spring:
  application:
    name: cuahangtienloi
#  security:
#    user:
#      name: admin
#      password: admin

  config:
    import: optional:file:.env[.properties], optional:file:backend/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuahangtienloi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5          # Neon free tier giới hạn concurrent connections
      minimum-idle: 1               # Giữ ít nhất 1 kết nối sống để tránh cold start
      idle-timeout: 60000           # 1 phút - đủ để Neon không sleep giữa các request
      connection-timeout: 30000     # Timeout chờ lấy connection từ pool
      max-lifetime: 300000          # 5 phút - thấp hơn server timeout của Neon
      keepalive-time: 30000         # Ping giữ kết nối sống mỗi 30 giây
      connection-test-query: SELECT 1   # Query ping kiểm tra kết nối còn sống
      initialization-fail-timeout: 0   # Cho phép app khởi động mà không crash nếu Neon đang sleep
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT phải nằm ngoài spring:
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# CORS cũng phải nằm ngoài spring:
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
#  liquibase:
#    change-log: classpath:db/changelog/db.changelog-master.yaml
#    enabled: false

logging:
  level:
    root: INFO
    com.erp.cuahangtienloi: INFO
    org.hibernate.SQL: ERROR
